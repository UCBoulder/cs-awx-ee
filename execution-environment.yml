---
version: 3
images:
  base_image:
    name: quay.io/centos/centos:stream9
dependencies:
  python_interpreter:
    package_system: python3.12
    python_path: /usr/bin/python3.12
  ansible_core:
    package_pip: ansible-core<2.19
  ansible_runner:
    package_pip: ansible-runner
  galaxy: spec/galaxy.yml
  system: spec/bindep.txt
  python: spec/requirements.txt
additional_build_steps:
  append_base:
    - RUN $PYCMD -m pip install -U pip
  append_final:
    - COPY --from=quay.io/ansible/receptor:devel /usr/bin/receptor /usr/bin/receptor
    - RUN mkdir -p /var/run/receptor
    - RUN git lfs install --system
    # SymLink `python` -> `python3.12`
    - RUN alternatives --install /usr/bin/python python /usr/bin/python3.12 312
    - ENV ANSIBLE_DEPRECATION_WARNINGS=False
    - ENV ANSIBLE_HOST_KEY_CHECKING=False
    - ENV ANSIBLE_INJECT_FACTS_AS_VARS=True
